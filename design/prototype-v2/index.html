<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>天俪 · 第二版设计原型</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#eceeef;color:#25282d}.shell{max-width:1760px;margin:auto;padding:32px 36px 24px}header{display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:24px}.identity{display:flex;gap:13px;align-items:center}.mark{height:44px;width:44px;background:#c94f35;color:white;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:600}h1{font-size:22px;font-weight:600;margin:0 0 5px;letter-spacing:.5px}.subtitle{font-size:12px;color:#737a83;margin:0}.version{font-size:11px;font-weight:400;letter-spacing:1px;margin-left:12px;color:#979da4}nav{display:flex;gap:5px;border:1px solid #dce0e3;border-radius:8px;padding:4px;background:#f6f7f8}button{font:inherit;cursor:pointer}nav button{height:34px;font-size:12px;border:0;background:none;color:#747b84;border-radius:5px;padding:0 15px}nav button.active{background:#fff;color:#25282d;box-shadow:0 1px 4px #0000000b;font-weight:600}.gallery{display:grid;grid-template-columns:repeat(4,390px);gap:28px;justify-content:center}.pane{width:390px}.pane[hidden]{display:none}.label{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;height:27px}.label h2{font-size:14px;font-weight:600;margin:0}.label h2 span{font-size:11px;color:#969ca4;margin-right:8px;font-weight:400}.label a{font-size:11px;text-decoration:none;color:#848b94}.phone{width:390px;height:844px;border-radius:22px;overflow:hidden;background:white;box-shadow:0 7px 23px #15233512;outline:1px solid #d9dde0}iframe{height:844px;width:390px;border:0;display:block}.caption{font-size:11px;color:#848b94;margin-top:12px;line-height:19px}.caption b{color:#505762;font-weight:400}.controls{display:flex;justify-content:space-between;gap:15px;align-items:center;margin:23px 0 0;border-top:1px solid #dce0e3;padding-top:16px;color:#858c95;font-size:11px}.controls button{border:0;background:#f8f9fa;padding:7px 11px;border-radius:5px;color:#606872;font-size:11px}.controls button+button{margin-left:6px}.gallery.filtered{display:flex;justify-content:center}.note{max-width:520px;line-height:19px}a:focus-visible,button:focus-visible{outline:2px solid #c94f35;outline-offset:3px}@media(max-width:1720px){.gallery{grid-template-columns:repeat(2,390px);gap:32px}.shell{max-width:910px}}@media(max-width:860px){.gallery{grid-template-columns:390px}.shell{padding:20px 14px}header{flex-direction:column;align-items:flex-start}.controls{flex-direction:column;align-items:flex-start}.gallery.filtered{flex-direction:column;align-items:center}}@media(max-width:420px){.shell{padding:16px 0}.identity,nav,.controls{margin-left:14px;margin-right:14px}.pane,.phone,iframe{width:100%}.gallery{display:block}.pane{margin-bottom:24px}.label,.caption{padding:0 14px}.phone{border-radius:0;outline:0}}
</style></head><body><main class="shell"><header><div class="identity"><div class="mark">俪</div><div><h1>天俪 · 上门服务<span class="version">DESIGN 02</span></h1><p class="subtitle">四个关键页面 · 统一组件 · 可交互原型</p></div></div><nav aria-label="角色筛选"><button class="active" data-filter="all">全部页面</button><button data-filter="user">用户端</button><button data-filter="tech">技师端</button><button data-filter="store">店长端</button></nav></header><section class="gallery" id="gallery">
<article class="pane" data-role="user"><div class="label"><h2><span>01</span>用户首页</h2><a href="app.html?screen=home" target="_blank">打开单页 ↗</a></div><div class="phone"><iframe title="用户首页" src="app.html?screen=home"></iframe></div><p class="caption"><b>先选服务，再选技师。</b> 项目、价格和可约时间直接可见。</p></article>
<article class="pane" data-role="user"><div class="label"><h2><span>02</span>确认预约</h2><a href="app.html?screen=booking" target="_blank">打开单页 ↗</a></div><div class="phone"><iframe title="确认预约" src="app.html?screen=booking"></iframe></div><p class="caption"><b>付款前确认完整信息。</b> 地址、技师、时段与一口价。</p></article>
<article class="pane" data-role="tech"><div class="label"><h2><span>03</span>技师工作台</h2><a href="app.html?screen=tech" target="_blank">打开单页 ↗</a></div><div class="phone"><iframe title="技师工作台" src="app.html?screen=tech"></iframe></div><p class="caption"><b>待办就是操作入口。</b> 接拒单、到达打卡、安全求助。</p></article>
<article class="pane" data-role="store"><div class="label"><h2><span>04</span>门店派单</h2><a href="app.html?screen=store" target="_blank">打开单页 ↗</a></div><div class="phone"><iframe title="门店派单" src="app.html?screen=store"></iframe></div><p class="caption"><b>先处理告警，再完成派单。</b> 接报和结案分别记录。</p></article>
</section><footer class="controls"><p class="note">原型使用演示数据与姓名头像，尚未接入真实支付、通话或业务后台。页面内的按钮可体验对应流程。</p><div><button id="reset">重置原型</button><button id="expired">演示倒计时结束</button></div></footer></main><script>
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.pane').forEach(p=>p.hidden=b.dataset.filter!=='all'&&p.dataset.role!==b.dataset.filter);document.querySelector('#gallery').classList.toggle('filtered',b.dataset.filter!=='all')}));
document.querySelector('#reset').onclick=()=>document.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage({type:'reset'},'*'));
document.querySelector('#expired').onclick=()=>document.querySelectorAll('iframe').forEach(f=>f.contentWindow.postMessage({type:'expire'},'*'));
if(new URLSearchParams(location.search).has('capture'))document.querySelectorAll('iframe').forEach(f=>f.src+='&capture=1');
</script></body></html>
