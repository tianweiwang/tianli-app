<!doctype html>
<html lang="zh-CN"><head><link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天俪 · 预约流程演示</title><style>
*{box-sizing:border-box}body{margin:0;background:#eceeef;font-family:"Microsoft YaHei",sans-serif;color:#25282d}.shell{max-width:1180px;margin:auto;padding:26px;display:grid;grid-template-columns:320px 390px;gap:40px;justify-content:center}h1{font-size:22px;margin:0 0 10px}p{font-size:13px;line-height:23px;color:#737a83;margin:10px 0}a{color:#c94f35}button,select{font:inherit}button{cursor:pointer;min-height:44px;padding:8px 10px;border:1px solid #d7dcdf;border-radius:7px;background:#fff;color:#25282d;display:flex;align-items:center;justify-content:center;text-align:center}.roles{display:flex;gap:7px;margin:18px 0}.roles button{flex:1}.roles .on{color:#c94f35;border-color:#c94f35;background:#fcf0eb}.tools{background:#fff;border:1px solid #dce0e3;border-radius:10px;padding:16px;margin-top:18px}.tools h2{font-size:14px;margin:0 0 10px}.tools select{width:100%;padding:10px;border:1px solid #dce0e3;border-radius:6px;margin-bottom:8px}.row{display:flex;gap:8px}.row button{flex:1;min-width:0}.state{font-size:12px;line-height:22px;white-space:pre-wrap;color:#5d636b;overflow-wrap:anywhere}.phone{width:390px;height:844px;border:1px solid #d9dde0;border-radius:20px;background:#fff;overflow:hidden;box-shadow:0 8px 28px #00000014}.phone iframe{width:100%;height:100%;border:0;display:block}@media(max-width:800px){.shell{display:flex;flex-direction:column;align-items:center;padding:16px;gap:20px}.side{width:100%;max-width:390px}.phone{width:min(390px,100%);height:844px}.tools{margin-top:10px}}
</style></head><body><div class="shell"><aside class="side"><h1>天俪 · 预约版</h1><p>选择门店、项目、技师和时间。切换角色可继续处理同一笔预约。</p><a href="index.html">查看全部状态设计稿</a><div class="roles"><button class="on" data-role="user">用户</button><button data-role="tech">技师</button><button data-role="store">店长</button></div><div class="tools"><h2>演示控制</h2><select id="scenario" aria-label="演示情景"><option value="reset">首次预约</option><option value="waiting">付款后待确认</option><option value="confirmed">已确认预约</option><option value="active">进行中与延长</option><option value="completed">已完成与售后</option><option value="specified">指定技师变更</option><option value="care">客服处理中</option><option value="refund">部分退款处理中</option></select><div class="row"><button id="scenarioGo">载入情景</button><button id="reset">重置演示</button></div><p>推进时间用于核对当前预约的超时规则。</p><div class="row"><button data-minutes="3">＋3分钟</button><button data-minutes="10">＋10分钟</button><button data-minutes="30">＋30分钟</button></div><div class="row" style="margin-top:8px"><button data-result="failed">提现失败</button><button data-result="revoked">提现撤销</button><button data-result="success">提现到账</button></div></div><div class="tools"><h2>当前演示记录</h2><div class="state" id="state">尚未创建预约</div></div><p>定位、身份核验、支付、退款、消息和文件均为本地模拟，尚未接入微信或后台。手机界面统一使用预约表达；真实业务类别和资质仍需正式核验。</p></aside><div class="phone"><iframe id="phone" title="天俪预约小程序演示" src="app.html?screen=u-home&demo=1"></iframe></div></div><script src="data.js"></script><script>
const frame=document.getElementById('phone');let snapshot={stage:'draft'};const send=data=>frame.contentWindow.postMessage({type:'tianli-v4-control',...data},location.protocol==='file:'?'*':location.origin);document.querySelectorAll('[data-role]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('on',b===button));send({action:'go',id:button.dataset.role==='tech'?'t-work':button.dataset.role==='store'?'s-board':snapshot.stage==='draft'?'u-home':'u-order-current'});});document.querySelectorAll('[data-minutes]').forEach(button=>button.onclick=()=>send({action:'advance',minutes:Number(button.dataset.minutes)}));document.querySelectorAll('[data-result]').forEach(button=>button.onclick=()=>send({action:'withdraw-result',result:button.dataset.result}));document.getElementById('scenarioGo').onclick=()=>send({action:'scenario',name:document.getElementById('scenario').value});document.getElementById('reset').onclick=()=>send({action:'scenario',name:'reset'});window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||(location.protocol!=='file:'&&event.origin!==location.origin)||event.data?.type!=='tianli-v4-state')return;snapshot=event.data.state;const stage={draft:'待填写',waiting:'待确认',confirmed:'已确认',active:'进行中',completed:'已完成',care:'客服处理中',cancelled:'已取消',closed:'已关闭',refunded:'已退款'}[snapshot.stage];document.getElementById('state').textContent=`预约：${stage}\n资金：${snapshot.finance}\n门店：${BookingData.store(snapshot.storeId).name}\n技师：${BookingData.tech(snapshot.techId).name}\n日期：${snapshot.date} ${snapshot.slot}\n本轮截止：${snapshot.roundDeadline?new Date(snapshot.roundDeadline).toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai'}):'尚未开始'}\n可提现：¥${snapshot.balance.toFixed(2)}\n最近操作：${snapshot.events.at(-1)?.event||'尚无'}`;});
</script></body></html>
