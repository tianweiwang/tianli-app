*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#eceeef;color:#25282d}.shell{max-width:1720px;margin:auto;padding:28px 32px 40px}header{display:flex;justify-content:space-between;gap:24px;align-items:center}.identity{display:flex;gap:13px;align-items:center}.mark{height:44px;width:44px;background:#c94f35;color:#fff;border-radius:12px;display:grid;place-items:center;font-size:24px;font-weight:600}h1{font-size:22px;font-weight:600;margin:0 0 5px}.subtitle,.note,.ref{font-size:12px;color:#737a83;line-height:20px}.subtitle{margin:0}.version{font-size:11px;margin-left:12px;color:#979da4;font-weight:400}nav{display:flex;gap:5px;border:1px solid #dce0e3;border-radius:8px;padding:4px;background:#f6f7f8}nav button{font:inherit;cursor:pointer;min-height:36px;font-size:12px;border:0;background:none;color:#747b84;border-radius:5px;padding:0 15px;display:flex;align-items:center;justify-content:center}nav button.active{background:#fff;color:#25282d;font-weight:600}.group{margin-top:30px}.group h2{font-size:16px;margin:0 0 14px}.group h2 span{font-size:12px;color:#8a9098;font-weight:400;margin-left:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,390px);gap:28px 26px}.pane{width:390px}.label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;gap:8px}.label b{font-size:14px}.label em{font-style:normal;color:#969ca4;font-weight:400;margin-right:7px;font-size:12px}.label .state{font-size:12px;color:#c94f35}.phone{width:390px;height:844px;border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 7px 23px #15233512;outline:1px solid #d9dde0}.phone iframe,.phone img{width:390px;height:844px;border:0;display:block}.caption{font-size:12px;color:#5f666f;margin:10px 0 3px;line-height:19px}.ref{margin:0;font-size:11px}a{color:#c94f35}body.capture .shell{padding:28px}body.capture nav,body.capture .note{display:none}body.capture .group{margin-top:18px}@media(max-width:650px){.shell{padding:18px 12px}header{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:minmax(0,390px)}.pane,.phone{max-width:100%}.phone{border-radius:12px}.phone iframe{width:100%}}
</style></head><body><main class="shell"><header><div class="identity"><div class="mark">俪</div><div><h1>天俪 · 预约<span class="version">DESIGN 04</span></h1><p class="subtitle" id="subtitle">三类端预约流程 · 需求说明 v0.4</p></div></div><nav aria-label="角色筛选"><button class="active" data-filter="all">全部</button><button data-filter="user">用户端</button><button data-filter="tech">技师端</button><button data-filter="store">店长端</button></nav></header><p class="note">按预约流程分组，数据为本地演示。<a href="demo.html">体验完整流程</a> · <a href="coverage.md">覆盖与验证记录</a> · <a href="README.md">使用说明</a></p><div id="groups"></div></main>
<script src="vendor/lucide.min.js"></script><script src="data.js"></script><script src="components.js"></script><script src="user-pages.js"></script><script src="staff-pages.js"></script><script src="catalog.js"></script><script>
const q=new URLSearchParams(location.search),capture=q.has('capture'),only=q.get('group');if(capture)document.body.classList.add('capture');const esc=UI.escape;
function draw(filter){const box=document.getElementById('groups');box.innerHTML='';for(const group of SCREEN_GROUPS.filter(g=>!only||g===only)){const items=SCREENS.filter(s=>s.group===group&&(filter==='all'||s.role===filter));if(!items.length)continue;const sec=document.createElement('section');sec.className='group';sec.innerHTML=`<h2>${esc(group)}<span>${items.length} 个状态</span></h2><div class="grid">${items.map(s=>`<article class="pane"><div class="label"><b><em>${esc(s.no)}</em>${esc(s.title)}</b><span class="state">${esc(s.state)}</span></div><div class="phone">${capture?`<img alt="${esc(s.title)}" src="exports/${encodeURIComponent(s.file)}">`:`<iframe loading="lazy" title="${esc(s.title)}" src="app.html?screen=${encodeURIComponent(s.id)}"></iframe>`}</div><p class="caption">${esc(s.caption)}</p><p class="ref">${esc(s.ref)}</p></article>`).join('')}</div>`;box.append(sec);}document.getElementById('subtitle').textContent=only?only+' · 需求说明 v0.4':`${SCREENS.length} 个状态 · 三类端预约流程 · 需求说明 v0.4`;}
document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b===button));draw(button.dataset.filter);});draw('all');
